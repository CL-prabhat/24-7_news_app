<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signal — AI-summarized news, by category</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead__inner">
    <h1 class="masthead__title">Signal</h1>
    <p class="masthead__tagline">Fresh headlines, summarized by AI, refreshed every hour. Pick a category below.</p>
  </div>
</header>

<nav class="tabs" id="category-tabs" aria-label="Filter by category"></nav>

<main class="feed" id="feed" aria-live="polite"></main>

<p class="status" id="status"></p>

<footer class="footer">
  <p>Updated automatically on a schedule, no server involved.</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.5.0/sql-wasm.js"></script>
<script src="app.js"></script>
</body>
</html>
